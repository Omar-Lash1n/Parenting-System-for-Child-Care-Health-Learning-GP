<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أجيال - لوحة إدارة المتخصصين</title>
    <meta name="description" content="لوحة تحكم الأدمن لإدارة طلبات تسجيل المتخصصين في منصة أجيال">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">أ</div>
            <span class="logo-text">أجيال</span>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>المتخصصون</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="admin-badge">
                <div class="admin-avatar">A</div>
                <span>Admin</span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="page-header">
            <div class="header-text">
                <h1>إدارة المتخصصين</h1>
                <p>مراجعة وإدارة طلبات تسجيل المتخصصين والأطباء</p>
            </div>
            <div class="header-actions">
                <div class="stats-card pending">
                    <span class="stats-number" id="pendingCount">0</span>
                    <span class="stats-label">قيد المراجعة</span>
                </div>
                <div class="stats-card approved">
                    <span class="stats-number" id="approvedCount">0</span>
                    <span class="stats-label">مقبول</span>
                </div>
                <div class="stats-card rejected">
                    <span class="stats-number" id="rejectedCount">0</span>
                    <span class="stats-label">مرفوض</span>
                </div>
            </div>
        </header>



        <!-- Filters -->
        <div class="filters-bar" id="filtersBar">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" onclick="filterByStatus('all')">الكل</button>
                <button class="filter-tab" data-filter="Pending" onclick="filterByStatus('Pending')">قيد المراجعة</button>
                <button class="filter-tab" data-filter="Approved" onclick="filterByStatus('Approved')">مقبول</button>
                <button class="filter-tab" data-filter="Rejected" onclick="filterByStatus('Rejected')">مرفوض</button>
            </div>
            <button class="btn btn-outline" onclick="fetchSpecialists()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                تحديث
            </button>
        </div>

        <!-- Table -->
        <div class="table-container" id="tableContainer">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>جارٍ التحميل...</p>
            </div>
            <table class="data-table" id="specialistsTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>الصورة</th>
                        <th>الاسم</th>
                        <th>التخصص</th>
                        <th>تاريخ التسجيل</th>
                        <th>الحالة</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
            <div class="empty-state" id="emptyState" style="display:none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" y1="11" x2="23" y2="11"/></svg>
                <p>لا توجد بيانات لعرضها</p>
            </div>
        </div>
    </main>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header">
                <h2>تفاصيل المتخصص</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic content -->
            </div>
            <div class="modal-footer" id="modalFooter">
                <!-- Dynamic buttons -->
            </div>
        </div>
    </div>

    <!-- Reject Reason Modal -->
    <div class="modal-overlay" id="rejectModal">
        <div class="modal modal-small">
            <div class="modal-header">
                <h2>سبب الرفض</h2>
                <button class="modal-close" onclick="closeRejectModal()">&times;</button>
            </div>
            <div class="modal-body">
                <textarea id="rejectionReason" placeholder="اكتب سبب الرفض هنا..." rows="4"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeRejectModal()">إلغاء</button>
                <button class="btn btn-danger" onclick="confirmReject()">تأكيد الرفض</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
