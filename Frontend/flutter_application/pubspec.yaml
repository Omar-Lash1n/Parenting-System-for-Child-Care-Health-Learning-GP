name: Ajial
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dropdown_search: ^5.0.6
  intl: ^0.20.2
  pinput: ^4.0.0
  dio: ^5.1.0
  flutter_secure_storage: ^8.0.0
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.3
  provider: ^6.1.2
  audioplayers: ^6.5.1
  image_picker: ^1.1.2 # (تحديث للنسخة الأحدث)
  path: ^1.9.0 # (تحديث)
  mime: ^2.0.0 # (تحديث) # (اختياري للتعامل مع أنواع الملفات)

dev_dependencies:
  flutter_test:
    sdk: flutter
  confetti: ^0.7.0
  animated_text_kit: ^4.2.2
  flutter_svg: ^2.0.10+1
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - images/
    - assets/sounds/
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: fonts/IBMPlexSansArabic-Regular.ttf
        - asset: fonts/IBMPlexSansArabic-Bold.ttf
        - asset: fonts/IBMPlexSansArabic-ExtraLight.ttf
        - asset: fonts/IBMPlexSansArabic-Light.ttf
        - asset: fonts/IBMPlexSansArabic-Medium.ttf
        - asset: fonts/IBMPlexSansArabic-SemiBold.ttf
        - asset: fonts/IBMPlexSansArabic-Thin.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#BF092F"
  adaptive_icon_foreground: "images/logo.png"
